---
- name: Create AWX Token Credential Type
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Create the 'AWX token' credential type
      awx.awx.credential_type:
        name: "AWX token"
        description: "API token for communicating with AWX"
        kind: cloud
        inputs:
          fields:
            - id: "awx_host"
              label: "AWX Host"
              type: "string"
              help_text: "The URL of the AWX instance (e.g., https://awx.example.org)"
            - id: "awx_token"
              label: "AWX Token"
              type: "string"
              secret: true
              help_text: "The AWX OAuth2 token."
          required:
            - "awx_host"
            - "awx_token"
        injectors:
          env:
            CONTROLLER_HOST: "{{ '{{' }}awx_host{{ '}}' }}"
            CONTROLLER_OAUTH_TOKEN: "{{ '{{' }}awx_token{{ '}}' }}"
        state: present
