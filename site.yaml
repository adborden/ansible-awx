---
- name: Configure AWX
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    awx_organization: "Default"
    git_repo_url: "https://github.com/adborden/ansible-awx.git"

  tasks:
    - name: Create the 'AWX token' credential type
      awx.awx.credential_type:
        name: "AWX token"
        description: "API token for communicating with AWX"
        kind: cloud
        inputs:
          fields:
            - id: "awx_host"
              label: "AWX Host"
              type: "string"
              help_text: "The URL of the AWX instance (e.g., https://awx.example.org)"
            - id: "awx_token"
              label: "AWX Token"
              type: "string"
              secret: true
              help_text: "The AWX OAuth2 token."
          required:
            - "awx_host"
            - "awx_token"
        injectors:
          env:
            CONTROLLER_HOST: "{{ '{{' }}awx_host{{ '}}' }}"
            CONTROLLER_OAUTH_TOKEN: "{{ '{{' }}awx_token{{ '}}' }}"
        state: present

    - name: Create AWX admin token credential
      awx.awx.credential:
        name: "AWX admin"
        organization: "{{ awx_organization }}"
        credential_type: "AWX token"
        inputs:
          awx_host: "{{ lookup('env', 'CONTROLLER_HOST') }}"
          awx_token: "{{ lookup('env', 'CONTROLLER_OAUTH_TOKEN') }}"
        state: present

    - name: Create Project
      awx.awx.project:
        name: "awx-configuration"
        organization: "{{ awx_organization }}"
        scm_type: git
        scm_url: "{{ git_repo_url }}"
        scm_branch: feature/awx
        state: present

    - name: Create Inventory
      awx.awx.inventory:
        name: "bayo vista"
        organization: "{{ awx_organization }}"
        state: present

    - name: Add host 'blue' to inventory 'bayo vista'
      awx.awx.host:
        name: "blue"
        inventory: "bayo vista"
        variables:
          ansible_connection: ssh
          ansible_user: ubuntu
          ansible_host: blue.lan
        state: present

    #- name: Create raspberry-pi group
    #  awx.awx.group:
    #    name: raspberry-pi
    #    inventory: bayo vista
    #    hosts:
    #      - blue
    #    state: present

    - name: Create Discord notifier
      awx.awx.notification_template:
        name: "discord"
        description: "RocketSOL"
        organization: "{{ awx_organization }}"
        notification_type: "webhook"
        notification_configuration:
          url: "https://discord.com/api/webhooks/1454526915913449555/q85-VdvqKJGxANQSBaaX641dtgZXeHv-ULu1vJWxIlQzY-sw9yN-ecdSQXzLxAzoI7F8"
          headers: {}
          http_method: "POST"
          disable_ssl_verification: false
        messages:
          error:
            body: |
              {% raw %}{
                "content": ":exclamation: Job **{{ job.name }}** failed after {{ job.elapsed }}s.",
                "embeds": [
                  {
                    "title": "Job #{{ job.id }} - {{ job.status }}",
                    "description": "{{ job.name }}",
                    "url": "{{ url }}",
                    "color": 15297910
                  }
                ]
              }{% endraw %}
          started:
            body: |
              {% raw %}{
                "content": ":arrows_clockwise: Job **{{ job.name }}** is running.",
                "embeds": [
                  {
                    "title": "Job #{{ job.id }} - {{ job.status }}",
                    "description": "{{ job.name }}",
                    "url": "{{ url }}",
                    "color": 3447003
                  }
                ]
              }{% endraw %}
          success:
            body: |
              {% raw %}{
                "content": ":white_check_mark: Job **{{ job.name }}** completed successfully after {{ job.elapsed }}s.",
                "embeds": [
                  {
                    "title": "Job #{{ job.id }} - {{ job.status }}",
                    "description": "{{ job.name }}",
                    "url": "{{ url }}",
                    "color": 1621586
                  }
                ]
              }{% endraw %}
          workflow_approval:
            denied:
              body: '{% raw %}{"content": "The approval node **{{ approval_node_name }}** was denied. {{ workflow_url }}"}{% endraw %}'
            running:
              body: '{% raw %}{"content": "The approval node **{{ approval_node_name }}** needs review. This node can be viewed at: {{ workflow_url }}"}{% endraw %}'
            approved:
              body: '{% raw %}{"content": "The approval node **{{ approval_node_name }}** was approved. {{ workflow_url }}"}{% endraw %}'
            timed_out:
              body: '{% raw %}{"content": "The approval node **{{ approval_node_name }}** has timed out. {{ workflow_url }}"}{% endraw %}'
        state: present

    - name: Create a Job Template with Webhook
      awx.awx.job_template:
        name: "Webhook Demo Job Template"
        project: "awx-configuration"
        inventory: "bayo vista"
        playbook: "hello.yml"
        webhook_service: github
        state: present

    - name: Create ansible-awx job template
      awx.awx.job_template:
        name: "apply awx-configuration"
        project: "awx-configuration"
        inventory: "bayo vista"
        playbook: "site.yaml"
        credentials:
          - AWX admin
        webhook_service: github
        state: present
